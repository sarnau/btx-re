# Analysis metadata for the Commodore BTX Decoder II firmware.
#
# This file is the source of truth for everything we learn about the ROM.
# out/btx_decoder_ii.asm is generated from (ROM bytes + this file) and must
# never be edited by hand.

# Hardware entry points: the reset vector plus the seven interrupt stubs.
entry_points = [
    0xB200,  # RESET
    0xF129,  # SCI  stub
    0xF12E,  # TOF  stub
    0xF133,  # OCF  stub
    0xF138,  # ICF  stub
    0xF13D,  # IRQ1 stub
    0xF142,  # SWI  stub
    0xF147,  # NMI  handler (bare RTI, also the null handler)
    0xF148,  # follows the NMI RTI
    0xF14C,  # installed into a soft vector by reset
    0xF1D8,  # called from $F148
    0xF61F,  # SCI receive handler, installed into softVecSci at $B287
    0xFC25,  # alternate SCI handler, installed into softVecSci at $F9A0
    0xF954,  # handler installed by LDD #$F954 at $F5EA and $F85E

    # Orphans: real code with no reachable caller. Listed so the disassembly
    # renders them as instructions rather than FCB. See the $E3EF comment.
    0xE3EF,
    0xF457,
    0xFAE4,
    0xFB00,

