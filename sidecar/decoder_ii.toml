[block_comments]
"0xB552" = """
CBM DOS filename template, 15 bytes at runtime $11AA:

    40 3A 42 54 58 2D 4D 41 4B 2D 00 2C 53 2C 57
    @  :  B  T  X  -  M  A  K  -  ..  ,  S  ,  W

"@:" overwrites an existing file, "BTX-MAK-" is the prefix, and ",S,W" opens a
sequential file for writing. The $00 in the middle is a slot the code fills in
with the macro identifier - the "Kennung" the prompt asks for - so one template
serves every macro. That slot is labelled c64MacroId, and the code writing to
it is what confirms the reading.

It is pointed at with FNADR before the open, which is what identifies it. The
label used to read c64Strings, from before the string table at $BA18 was found;
this block is a filename, not the strings."""
"0xB4B0" = """
Data between the jump table and the string records.

The nine $00 bytes at runtime $10B7 are padding, not data: the jump table ends
there and $10B7 + 9 is $10C0, where c64BufStart begins, so they align the
pointer table to a 16-byte boundary. Nothing references them.

What follows is 4-byte records such as 89 10 52 00 / 8B 10 41 00 / 8A 10 54 00,
which look like a key or character translation table. Not yet decoded."""
"0xBC19" = """
Character table, runtime $1871-$188E, sitting straight after an RTS so a
linear sweep runs into it and disassembles the bytes as instructions.

    23 40 3B 7B 3A 7C 40 7D 2B 7E 5D 5B 5B 5C BA 5D 2D
    00 DD 00 5E 00 DE 00 5C 00 A9 00 00 00

The first run is # @ ; { : | @ } + ~ ] [ [ \\ : ] - which are precisely the
positions where the German and ASCII keyboard layouts differ - the same choice
the "Keyboard: deutsch oder ASCII?" prompt offers. The tail pairs each $00 with
a high-bit code ($DD, $DE, $A9), which look like the PETSCII characters those
positions map to.

Read as a layout translation table on that basis, and the code confirms the
shape: $17D2 points c64KeyPtr here and then walks it with

    LDA (c64KeyPtr),Y / BEQ done      $00 ends the table
    TXA / CMP (c64KeyPtr),Y / BEQ hit
    INY / INY                       two bytes per entry

so it is a two-byte-per-entry lookup terminated by $00. Which byte is the
input and which the output is not established, and the pairing across the
whole table has not been decoded."""
"0xC701" = """
The payload's IRQ handler, installed into CINV.

    BIT btxReg1F8 / BMI ...     test a decoder register
    JSR L104B                   a jump-table entry
    JMP KEY                     chain to the KERNAL handler

So the C64 side services the decoder on interrupt as well as polling it, and
either passes the interrupt on to the KERNAL or consumes it. btxReg1F8 is one
of the registers whose function is otherwise unestablished; that the handler
tests it first says it carries a request or status bit."""
"0xB582" = """
c64CapEnd, runtime $11DA - how far the capture buffer is filled.

A 16-bit address, not two flags: c64StartSession and c64MenuTelesoft set it to
c64BufStart, c64CaptureRun and c64CaptureEnd copy c64BufWr into it when the
capture stops, and c64MenuDisplay and c64SaveBuffer walk c64BufWr from
c64BufStart up to it. Both halves are always written and compared as a pair.

It sits inside the variable block, so the ROM image holds its initial value -
$0000 - rather than a meaningful address."""
"0xB561" = """
The payload's variables, runtime $11B9-$11F7, followed by the 31 CEPT status
records at $11F8-$166F and the c64StrTable that indexes them.

The ROM image holds their initial values, all $00, which is why this area first
reads as unprintable filler in front of the text.

  $11B9  c64Tmp         a shared scratch byte - the key c64Menu is looking up,
                        the send index in c64ShowMsgPtr and c64MenuEdit
  $11BA  c64DirCount    characters left in a c64MacroDirLine entry
  $11BB  c64SaveSA      holds SA across the open in c64DiskOpenRead
  $11BC  c64FnLen       length of the name in c64FnBuf
  $11BD  c64FnMax       the limit c64InputLine was called with
  $11BE  c64FnBuf       the filename buffer. c64OpenSeqWrite and
                        c64OpenPrgWrite append ",S,W" and ",P,W" at c64FnLen
  $11BF  c64FnBuf2      the second byte of that buffer, stored directly when
                        c64MenuEdit substitutes a one-character name

  $11D7  c64MsgLen      the count byte of the record c64ShowMsgPtr is sending
  $11D8  c64RecFlag     a macro is being recorded
  $11D9  c64CapFlag     a capture is running
  $11DA  c64CapEnd      how far the capture buffer is filled
  $11DC  c64DosErr      set when the DOS error channel did not read 00
  $11DD  c64LastByte    the byte c64MenuDisplay sent last, so it can pause
                        after a $11
  $11DE  c64DelayCnt    c64DelaySecs' countdown, seconds times five

  $11DF  c64XferCols    columns left in the row c64MenuXfer is reading back
  $11E0  c64XferReq     the row it asks the decoder for, $11 through $29
  $11EE  c64PlotCol     where c64CellToScreen puts the result
  $11EF  c64PlotRow

  $11E1  c64CellChar    one cell, as the decoder hands it over: the character
  $11E2  c64CellAccent  the combining accent, $48 being the diaeresis
  $11E3  c64Cell3       stored by both readers, never read back
  $11E4  c64CellSet     bits 0-2 select the character set, bit 3 marks an accent
  $11E5  c64Cell5       stored by both readers, never read back
  $11E6  c64CellAttr    bit 2 reverses the character, bit 3 shows it at all

  $11E7  c64MenuLine    which of the two menu lines c64Menu is showing
  $11E8  c64GermanFlag  German keyboard selected, so c64GermanKeys is searched
                        and c64GetKey swaps Y and Z
  $11E9  c64KeyOut1     what c64XlatKey made of the key, up to three CEPT bytes
  $11EA  c64KeyOut2
  $11EB  c64KeyOut3
  $11EC  c64PlayFlag    a macro is being played back, so c64GetKey reads the
                        file instead of the keyboard
  $11ED  c64LineShadow  the last value read from the decoder's line counter
                        btxReg011, which is how c64WaitDecoder sees it move
  $11F7  c64AlphaFlag   alpha mode, which puts c64AsciiKeys in front of
                        c64XlatKey's search chain

  $11F0  c64TsInTag     the telesoftware parser is inside a <x ... > tag
  $11F1  c64TsPair      which half of a 6-bit pair is next
  $11F2  c64TsHi        the first half, held while the second arrives
  $11F3  c64TsLo        the second half
  $11F4  c64TsType      $00 for a C or E record, $FF for a G record. The two
                        are selected by the LDA #$00 / FCB $2C / LDA #$FF
                        skip at $2ABD
  $11F5  c64TsCount     bytes left in the current record
  $11F6  c64TsRun       bytes left in the run inside it

The records are named after the German text they carry, so the index c64ShowMsg
is called with is readable at the call site: msgNoDrive rather than message 13.
msgBlank is the all-space record c64ClearMsg uses to wipe the status line, and
msgErrLine is the empty 4-byte one c64DiskShowError draws before streaming the
drive's own message into it."""
"0xB468" = """
Seven pointer slots, runtime $10C0-$10CD, read individually rather than indexed.

  $10C0  c64BufStart       ceptStartPage - the base of the capture buffer
  $10C2  c64BufEnd         $8000, the cartridge window: the buffer runs up to
                           the decoder I/O and no further. Left as two bytes,
                           since only the page at c64BufEndPage is ever tested
  $10C4  c64StartPagePtr   ceptStartPage again, the page c64StartSession sends
  $10C6  c64CtrlKeysPtr    c64CtrlKeys, the two bytes right after this block
  $10C8  c64GermanKeysPtr  c64GermanKeys
  $10CA  c64MacroDirPtr    ceptMacroDir, the "Makro-Verzeichnis" page
  $10CC  c64StrTablePtr    c64StrTable, the status-message table

The first two slots pair up: the capture buffer starts where ceptStartPage sits,
so the startup page is the first thing a capture overwrites.

The three key tables form c64XlatKey's search chain, tried in this order:

  c64AsciiKeys   2-byte records, only while alpha mode is on. The ASCII
                 bracket set - # @ ; : @ + [ ] map to @ { | } ~ [ \\ ]
  c64GermanKeys  4-byte records, only while the German keyboard is selected.
                 @ [ \\ ] : ; and their shifts become the umlauts, via the CEPT
                 diaeresis composition $19 $48 followed by the base letter
  c64CtrlKeys    4-byte records, always searched last. Cursor keys, DEL, HOME,
                 CLR, the eight colour keys and F1-F8

A record is one PETSCII key followed by the CEPT bytes it expands to, up to
three of them, and a $00 in the first CEPT byte means the key is swallowed."""

"0xBD3F" = """
Menu key dispatch: records of one ASCII key byte then a 16-bit handler
address, terminated by $00.

    'L' -> $102D    'C' -> $103C    'D' -> $1042    'M' -> $1039
    'X' -> $1045    'A' -> $1024    'B' -> $1027    'S' -> $1048
    'K' -> $104E    'P' -> $1051    'E' -> $1054    'Q' -> $102A
    'T' -> $10AB

The keys are the highlighted letters of the two menu lines - "Load Capture
Display Macro Xfer Screen" and "ASCII Btx Keybd Telesoft Edit Pause Quit" -
and every target is an entry in the jump table at $1000, so this is what turns
a keypress into a command."""
"0xBDE9" = """
CEPT datastream, not C64 screen text.

The payload composes pages in the decoder's own protocol and sends them across
rather than drawing on the C64 screen, so these blocks read as control codes
mixed with text:

    $1F r c   US, then row and column - CEPT cursor positioning
    $9B ...   CSI, the C1 introducer the firmware dispatches at $D289
    $1B ...   ESC, dispatched at $D1C9
    $12 c n   RPT, repeat a character - ctlRPT at $DB2B in the firmware

Three of them exist:

  ceptMonitorMsg  $BDE9  "C-64 - Betrieb", then positioned lines
                         "falls noetig,", "Monitor an den Rechner",
                         "umstecken"
  ceptMacroDir    $CD17  "Makro-Verzeichnis"
  ceptStartPage   $CF65  the startup page: "commodore" in text followed by
                         G1 mosaic characters ($A0-$DF) drawn with RPT runs,
                         which is why it looks like noise as bytes. It ends
                         with "V1.6 141087wr" - the C64 payload's own version
                         and a date, 14 October 1987, plus what look like
                         author initials. That is a different version line
                         from the firmware's "Decodersoftware V3.3" at $EFF5,
                         so the two halves are versioned separately.

That the C64 side speaks CEPT to the decoder is what makes ctlRPT and the
mosaic set visible from both directions - the firmware decodes exactly what
this data encodes."""
"0x0061" = """
The five zero-page pointers, runtime $61-$6E.

The payload does no floating-point arithmetic, so the C64 ROM names for these
locations - FACEXP..ARGSGN, BASIC's two floating-point accumulators - say
nothing about what the payload keeps there. They are five 16-bit pointers, each
used for one job throughout:

  $61  c64Ptr      a general indirect. Walks the $00-terminated CEPT streams
                   that go out to the decoder - the startup page,
                   ceptMonitorMsg, ceptMacroDir - and holds the handler address
                   that c64Menu reaches with JMP (c64Ptr)
  $63  c64MsgPtr   the status message. c64ShowMsg puts a c64StrTable entry here
                   and c64ShowMsgPtr sends the record it points at
  $65  c64BufWr    the capture buffer write cursor, run against c64BufEndPage
  $69  c64KeyPtr   the key table c64XlatKey is currently searching, pointed in
                   turn at c64AsciiKeys, c64GermanKeys and c64CtrlKeys
  $6D  c64BufRd    the capture buffer read cursor. Only c64TelesoftByte uses it,
                   which is the one place that reads and writes the buffer at
                   once, making it a ring

The high bytes carry their own names rather than reading as +1, because the
symbol table is per address and because the code touches them on their own -
INC c64BufWrHi / CMP c64BufEndPage is how the buffer end is detected.

$6C, BASIC's ARGMO, is never touched. It used to appear in the EQU list because
the emitter matched immediates against the symbol table, so LDA #$6C pulled the
name in; immediates are values, not addresses, and no longer do.

The KERNAL file variables above are used as intended: FNLEN, LA, SA, FA and the
FNADR pointer are set up before OPEN, LOAD and CLOSE, and the payload drives
the IEC bus through the routines behind them.

Only locations with well-established names are listed. The rest of the zero
page the payload touches - the BASIC workspace below $60 and a scattering
above $B0 - is left as addresses, since a name there would be a guess."""
"0xC80C" = """
Filename of the extra software: "BTX-EXTRA.MAS", null-terminated.

Loaded from disk when the user picks Telesoft, which is what the status
message "Zusatzsoftware wird geladen" refers to. It sits immediately after an
RTS, so a linear sweep runs straight into it and disassembles the characters
as instructions."""
"0xC84C" = """
Startup screen text, PETSCII, ROM $C84C-$C94C (runtime $24A4-$25A4).

Opens with $0E $08 $93 - switch to lower case, disable the Shift+Commodore
case toggle, clear screen - then the message, with $0D for line breaks and
$11 for cursor-down. Letters that appear as high-bit values ($CD, $C2, $D3 and
so on) are shifted PETSCII, so the text reads:

    BILDSCHIRMTEXT
    BITTE STECKEN SIE IHREN MONITOR
    AN DAS BTX-MODUL AN,
    ODER WAEHLEN SIE DIE EINGE-
    SCHRAENKTE TEXTDARSTELLUNG
    MIT "<F7> S".
    SIE VERLASSEN BTX MIT "<F7> Q".

So the module tells the user to plug a monitor into the decoder itself, and
offers a reduced text-only mode on the C64 screen as the alternative - which
is what the separate 8x10 narrow font at $9E00 is for."""
"0xBA18" = """
String table: 31 little-endian pointers, ROM $BA18-$BA55, runtime $1670-$16AD.

This is how the text is reached - nothing addresses a record directly, which is
why searching for pointers to the visible strings came up empty. Each entry
points at a record header, not at the text:

    [0] $11F8  18 00 C0 01 98  "von Diskette: File? "
    [3] $126B  2C 00 C0 01 98  "Load Capture Display Macro Xfer Screen  "
    [4] $1298  2C 00 C0 01 98  "ASCII Btx Keybd Telesoft Edit Pause Quit"

A record is five header bytes followed by the text. Header byte 0 is the record
length minus one, which is what makes the stride vary: $2C gives a 45-byte
record with 40 characters, $18 a 25-byte record with 20, $04 a 5-byte record
with none. Byte 1 is always $00 and byte 4 always $98; bytes 2 and 3 vary
($C0/$80, $01/$07) and look like display parameters, not yet established.

The earlier reading of these five bytes as a trailer was wrong - they lead the
record, and the pointers here prove it."""
"0xB372" = """
Handing control to the payload.

    LDA #$00 / STA btxStatus     bank the cartridge out
    JMP (btxLoadLo)              jump through $8000

$8000 is cartridge ROM while the cartridge is mapped, holding the cold-start
vector $8013. The loader has already written the fetched load address into
btxLoadLo/btxLoadHi - stores land in the RAM underneath the ROM - so once the
cartridge is banked out the same indirect read returns $1000 instead, and
control lands on the payload rather than back in the bootstrap.

That is why the loader stores the load address twice, to $61/$62 for its own
copy loop and to $8000/$8001 for this jump."""
"0xB3A8" = """
C64 payload: a 61-entry JMP dispatch table at runtime $1000-$10B6, then code at
$174C-$2943 with data below it. The table is the module's whole API surface, and
the C64 side of the module is entirely built out of it - nothing calls a routine
except through its slot.

Each slot is labelled vec<Name> and its body c64<Name>, so a call site reads
JSR vecSendByte and the routine it lands in is c64SendByte. Vectors 44 and 45
share one body (c64CellOut at $220B) under two slots, vecCellToFile and
vecCellToPrinter; c64MenuXfer picks between them on FA == 4.

vecColdStart doubles as the payload's load address - it is what c64LoadAddr
points at, so the .prg header and vector 0 are the same $1000.

The menu at vector 4 is what unlocks the rest. It reads one letter and looks it
up in c64MenuKeys. The two menu lines it displays are messages 3 and 4 of
the string table -

    Load Capture Display Macro Xfer Screen
    ASCII Btx Keybd Telesoft Edit Pause Quit

Each letter therefore names its handler, and the German status messages in
c64StrTable confirm what each one does:

  L  vector 15  c64MenuLoad       msg 0  "von Diskette: File?"
  C  vector 20  c64MenuCapture    msg 5  "Capture-Modus ein - Ende: STOP-Taste"
  D  vector 22  c64MenuDisplay    msg 6  "Capture-Puffer anzeigen"
  M  vector 19  c64MenuMacro      msg 11 "Macro ausfuehren: Kennung?"
  X  vector 23  c64MenuXfer       msg 14 "Drucker oder File"
  S  vector 24  c64MenuScreen     msg 17 "C-64-Monitor zugeschaltet"
  A  vector 12  c64MenuAscii
  B  vector 13  c64MenuBtx
  K  vector 26  c64MenuKeybd      msg 16 "Keyboard: deutsch oder ASCII?"
  T  vector 57  c64MenuTelesoft   msg 26 "Telesoftware: File?"
  E  vector 28  c64MenuEdit       msg 21 "Macro anlegen: Kennung?"
  P  vector 27  c64MenuPause      msg 19 "Pause: wieviele Sekunden (1-9)?"
  Q  vector 14  c64MenuQuit       ceptMonitorMsg, then JMP (KERNAL_RESET)

The splash text matches: it tells the user to reach the menu with <F7>, and
c64MainLoop opens it on PETSCII $88, which is F7.

The remaining vectors group into six layers:

  transport   6 8 7        the two rings shared with the 6801 (btxReg040 out,
                           btxReg020 in) plus a blocking read
  keyboard    53 5 3 29    GETIN or macro playback -> QWERTZ fixup -> CEPT
  display     31 30 40 9   the status-line overlay, drawn from c64StrTable
  rendering   46 43 44 55  one cell (6 bytes) -> a character, then to the C64
              56 25        screen, the printer, or the cursor; 25 is the CINV
                           hook the decoder raises when it posts a cell
  disk        16 17 18 33  device 8: read channel 4, write channel 4,
              38 39 48 59  error channel 15, and the shared OPEN primitive
              60 49        49 is the device 4 printer instead
  macro       34 35 36 37  "@:BTX-MAK-<id>" on channels 5 (record) and 6
              47 50 51 52  (play), plus the "Makro-Verzeichnis" listing

Two findings for anyone continuing:

  - $11D7-$11FC is a VARIABLE block, not text. Code stores into $11D8-$11F7,
    which is what separates it from the string records that follow. The ROM
    image holds their initial values, which is why that area first reads as
    unprintable filler in front of the text.
  - The c64StrTable records are length-prefixed: a count byte, four parameter
    bytes ($00 $C0/$80 $01/$07 $98) and then the text. c64ShowMsgPtr sends
    exactly count bytes, which is what fixes the framing."""

"0xE3EF" = """
Unreachable code. This is one of four orphan fragments, 43 bytes in total:

  $E3EF-$E402  20 bytes  LDX #$0001 / LDAB #$C0 / JSR $EDF7 / ... / JMP $E47D
  $F457-$F458   2 bytes  SEC / RTS
  $FAE4-$FAF5  18 bytes  bump $0617, wrap at $50, else JMP $FA3A
  $FB00-$FB02   3 bytes  JMP $FA3A

Each disassembles cleanly and ends properly, so they are real routines, not
misparsed data. They are simply dead:

  - none of the four addresses occurs anywhere in the image as a 16-bit value,
    so nothing calls or jumps to them and no table holds them;
  - no relative branch targets them;
  - each is preceded by an instruction that ends flow ($E3EC JMP, $F456 RTS,
    $FAE1 JMP, $FAFF RTS), so they cannot be reached by falling through.

Every computed jump in the firmware dispatches through one of the six tables
now enumerated, and none of them contains these addresses. Leftovers from an
edit, most likely - $FAE4 and $FB00 sit among the ASCII terminal-mode handlers
and duplicate logic that appears nearby.

They are listed as entry points only so the listing shows instructions instead
of FCB; they are not live code."""
"0xF9FA" = """
ASCII terminal-mode C0 dispatch: 32 big-endian entries, $F9FA-$FA39.

asciiDispatchC0 ($FBA9) pulls the byte, masks bit 7, and dispatches anything
$00-$1F through this table:

    PULA / ANDA #$7F / CMPA #$1F / BHI printable
    TAB / ASLB / LDX #asciiCtrlTable / ABX / LDX 0,X / JSR 0,X

This is a second, much smaller control-code interpreter, separate from the CEPT
one at $D36A - it serves the ASCII Terminal-Mode listed in strModeNames. Nine
distinct handlers cover the 32 slots."""
"0xAEF0" = """
Font bases, then a bit-doubling table.

$AEF0 holds the five character-generator base addresses - $8000, $8780, $8F00,
$9680 and $9E00 - followed by $2700.

$AEFC begins a lookup that expands each bit of an index into two, which is the
transform double-width rendering needs. Entries 1..15 are exactly
bit-double(index) ($0003, $000C, $000F, $0030, ...), and the table continues in
16-entry blocks past $AF1A. It feeds the DBW and DBS attribute handlers."""
"0xEFF5" = """
Status messages, 20 columns each, and the version string.

"Anwahl", "Bitte warten...", "Verbindung", "nicht verbunden", "Abbruch",
"Decodersoftware V3.3", "Belegt".

The version string is what dates the two ROM revisions against each other:
this image is V3.3 and CV30113 is V3.1, so this is the newer build. See
docs/cv30113-revision-diff.md."""
"0xEF67" = """
Terminal mode names, 20 columns each: "CEPT Bildschirmtext", "PRESTEL
Videotex", "ASCII Terminal-Mode", "ANTIOPE", "HEX-Tastatureingabe".

The decoder therefore speaks more than CEPT - PRESTEL is the British videotex
variant and ANTIOPE the French one."""
"0xFD21" = """
Unused ROM. 719 bytes of $FF fill running to $FFEF, where the hardware vector
table begins."""
"0xDC6D" = """
Colour handlers, written as a skip chain.

The eight entries are three bytes apart and each is a separate jump-table
target:

    c1aAlphaBlack:  LDAA #$00
                    FCB  $B5        <- BITA extended, swallows the next stub
    c1aAlphaRed:    LDAA #$01
                    FCB  $B5
    ...

Entering at any stub loads that colour index; the $B5 opcode then consumes the
following LDAA as its own two operand bytes, so control falls through to the
common tail without a jump. Three bytes per colour instead of five.

The listing shows the skipped opcode as FCB because it overlaps the next entry
point. The same idiom appears at $DD41, $DE01 and $DE9C."""
"0xFCDB" = """
Screen line-address tables: four tables of 25 big-endian pointers, one entry
per display row, $FC45-$FD0C. 25 rows of 40 columns - the CEPT 24-row page
plus a status line.

  table  base    stride  span         role
  $FCDB  $4000     40    $4000-$43C7  rowRender   derived render byte per cell
  $FCA9  $4400    160    $4400-$539F  rowAttr     four attribute bytes per cell
  $FC77  $5400     40    $5400-$57C7  rowChar     character codes
  $FC45  $5800     40    $5800-$5BC7  rowAccent   combining diacritical overlay

$E9A5 reloads all four row pointers into rowChar/rowAttr/rowCharAlt/rowRender
whenever the cursor row changes. Roles established from the write sites:

  rowChar     $E943 on the main character path:
              LDAB cursorCol / LDX rowChar / ABX / LDAA charCode / ORAA #$80 /
              STAA 0,X - the character code with bit 7 set. Bit 7 is a per-cell
              flag rather than data: $A243, $DB1B, $DB96, $E538 and $EE21 all
              set it on this plane without touching the low seven bits, so it
              reads as a dirty/redraw marker.
  rowAttr     $E7E6 writes attr0..attr3 to 0,X..3,X at cursorCol*4. Those four
              bytes are only ever bit-manipulated by the C1 handlers at
              $DE00-$DF10 - the CEPT attribute set - and never receive a raw
              byte, which is what distinguishes them from the character code.
  rowRender   $E87E stores a byte assembled at $E860 from attribute bits
              (BITA #$03 -> ORAB #$02, BITA #$04 -> ORAB #$80, and so on), so
              this plane is derived state for the display hardware, not
              content.
  rowAccent   $E972, reached only when the character is a G2 non-spacing
              diacritical. Stores charCode AND $7F and sets accentPending.

The second character plane is NOT a duplicate: $5800 is the combining-accent
overlay. $E91D gates it on two conditions -

    LDAA gSetSelector / CMPA #$01      character came from G2
    LDAA charCode / ANDA #$70 / CMPA #$40   code in $40-$4F

which is exactly where CEPT G2 puts the non-spacing diacriticals, matching the
accent glyphs rendered from the $8780 font set. $E972 stores the mark and
returns WITHOUT advancing the cursor - the defining property of a combining
character - whereas the normal path at $E94E does INC cursorCol / JSR $EC16.

The sequence is:

  1. a G2 mark $40-$4F arrives: stored in the $5800 plane at the current cell,
     cursor unmoved, accentPending = $FF;
  2. the next character arrives: $E8D5 ORs bit 3 of accentPending into that
     cell's attribute byte, then clears accentPending;
  3. the base character goes to the $5400 plane and the cursor advances.

The firmware only ever writes $5800 - the sole reads of its row pointer are
the write at $E972 and the setup at $E9C1 - so the video hardware consumes it,
compositing the mark from $5800 over the glyph from $5400 with the attribute
bit as the enable."""
"0xF14C" = """
75-baud transmit: a software UART clocked by the timer output compare.

The BTX line is asymmetric - 1200 baud down, 75 baud up - and the two
directions are handled by completely different hardware:

  receive   the 6801 SCI, RMCR = $0C (CC1:CC0 = 11, EXTERNAL clock, so the
            modem supplies the 1200-baud bit clock). TRCSR = $08 enables the
            receiver only; $F5B4 later raises it to $18 for RE + RIE.
  transmit  this routine. TRCSR bit 1 (TE) is NEVER set and TDR is never
            written anywhere in the image, by any addressing mode - the SCI
            transmitter is entirely unused.

Each output compare reloads OCR with +$3415 (13333 cycles = 75.002 Hz at a
1 MHz E clock) and drives one bit by writing TCSR bit 0, which is OLVL - the
level the compare hardware places on P21. Letting the timer drive the pin
keeps the bit timing free of interrupt-latency jitter.

Frame: idle -> fetch a byte from the ring at txRing when head != tail, store
it complemented in txShift, set txBitsLeft = 9, and raise OLVL for the start
bit. Each later tick shifts the next bit into OLVL; when txBitsLeft reaches 1
the line is driven low for the stop bit.

With nothing to send the routine falls through to $F1B3, which services
housekeeping and a countdown at $04CB."""
"0xB2E2" = """
Ship the C64 payload across the dual-port interface.

    LDAA #$FF / STAA c64XferEn      enable transfer
    TST c64Status (twice)           wait for the C64, double-read for stability
  loop:
    LDX $0406 / INX
    CPX #$D109 / BEQ done           payload ends at $D108
    LDAA 0,X                        next payload byte
    LDAB c64FifoWr                  our write index
    LDX #c64Fifo / ABX              slot = $6080 + index
    INCB / ANDB #$0F                advance, 16-slot ring
    CMPB c64FifoRd (twice)          spin while full
    STAA 0,X / STAB c64FifoWr       store byte, publish index
    BRA loop
  done:
    CLR c64XferEn / wait c64Status / STAA c64XferDone

$0406 is the source pointer, seeded with LDX #$B3A5 at $B2DC; the INX before
each fetch makes $B3A6 the first byte sent - the two-byte load address the C64
loader consumes. So $B32D-$B3A5 is NOT streamed: the C64 executes it directly
from cartridge ROM at $8000. Only $B3A6-$D108 goes through the FIFO.

Both sides guard against metastability the same way, reading a shared index
twice and acting only when the two reads agree - CMPB c64FifoRd here, and
LDA $8009 / CMP $8009 / BNE in the C64 bootstrap.

$0406 is a shared scratch pointer, reused at $EA54 and elsewhere for pointer
tables at $FC45/$FC77/$FCA9/$FCDB."""
"0x1B1E" = """
Display cursor state.

$1B1F is the column, wrapped against 40 ($28) and 39 ($27) - the CEPT screen
width. $1B1E is the row, clamped between scrollTop ($1B1C) and scrollBottom
($1B1D) with an absolute ceiling in cursorRowMax ($1B00).

$EC16 is the wrap logic: column below 0 sets it to 39 and decrements the row;
column reaching 40 clears it and increments the row. $EC8D and $ECA1 are the
bounded row decrement and increment, each falling through to scroll ($EB28 /
$EA44) when the cursor is already at the window edge.

The $1B00-$1B2D block is therefore RAM holding display state, NOT a
memory-mapped peripheral as its all-read/write access pattern first suggested."""
"0x0000" = """
Hardware memory map, as established from the addresses the firmware touches.

  $0000-$001F  6801 internal register file
  $0080-$00FF  6801 internal RAM; interrupt soft vectors at $00F0-$00FB
  $0400-$07FF  external RAM, ~1 KB of variables; the stack grows down from
               $0400 (LDS #$0400 at reset), so $0000-$03FF is stack space
  $1B00-$1B2D  RAM holding display/cursor state (see $1B1E), not a peripheral
  $4000-$5BC7  display memory, four planes addressed via the line tables at
               $FCDB/$FCA9/$FC77/$FC45 (see the comment there)
  $6009-$6011  C64 dual-port control and status
  $6080-$608F  16-byte shared FIFO to the C64
  $61F9-$61FD  write-only control registers
  $8000-$FFFF  this ROM

Internal register usage shows PORT3 (43 accesses) as the busiest port, the
timer (TCSR/OCRH) in use, and the SCI active on RMCR, TRCSR and RDR. TDR is
never written by traced code, so the serial path looks receive-oriented in
what has been reached so far."""
"0xB32D" = """
C64-side 6502 code, $B32D-$D108. Not 6801 - the cartridge carries the C64's
BTX terminal application in the same 32 KB image as the 68B01 firmware, which
is why a 6801 trace never reaches it.

$B32D-$B33F  c64CartHeader C64 autostart cartridge header
$B340-$B3A5  c64ColdStart  cartridge cold-start, runs at C64 $8000
$B3A6-$B3A7  c64LoadAddr   $00 $10 - little-endian load address $1000
$B3A8-$D108  vecColdStart  7521 bytes, loaded to C64 $1000-$2D60

ROM $B32D maps to C64 $8000, proved by the cartridge header itself:

    $B32D  13 80              cold start vector  $8013
    $B32F  72 FE              warm start vector  $FE72
    $B331  C3 C2 CD 38 30     "CBM80" autostart signature
    $B336  00 00 00 FF 00...  padding

$8013 resolves to ROM $B32D + $13 = $B340, exactly where the cold-start code
begins - and independently, the JMP $8036 at $B36D lands exactly on $B363.

The bootstrap then runs from cartridge ROM at C64 $8000:

    JSR IOINIT / SIZE+8 / RESTOR / PCINT   the C64 cold-start sequence
    LDX #$00 / STX $D016                VIC setup
    JSR $804D / STA $61                 fetch load address low byte
    JSR $804D / STA $62                 fetch load address high byte
    LDY #$00
  loop:
    JSR $804D / BCS done / STA ($61),Y  copy one byte
    INY / BNE loop / INC $62 / JMP loop

$804D fetches the next byte from the decoder; carry set marks end of stream.
The two bytes at c64LoadAddr are the first thing that loop consumes, which is
what puts the payload at $1000. Ports $8000, $8001, $8009, $800A and $800B are
the C64's window onto the decoder hardware.

The payload begins with a 61-entry JMP table at runtime $1000-$10B6 - the
module's dispatch vector - with bodies at $174C-$2943.

Load address established three independent ways:
  1. the $00 $10 PRG header at $B3A6, consumed by the loader above;
  2. offset $A3A8 puts 97.6% of the payload's own JSR/JMP targets on real
     instruction boundaries, against 11.7% and 5.9% one byte either side;
  3. call sites JSR into a series spaced 3 apart based at $1009, which is
     entry 3 of the jump table at $1000.

German UI strings run $B552-$B9FF (runtime $11AA-$1657), padded to 40 columns:
"Load Capture Display Macro Xfer Screen", "ASCII Btx Keybd Telesoft Edit Pause
Quit", "Capture-Modus ein - Ende: STOP-Taste", and the macro prefix
"@:BTX-MAK-".

Note $D109-$D348 is NOT part of this payload - those are the 6801 control-code
dispatch tables documented at $D36A."""
"0xD419" = """
Format-parameter lookup: one key table plus three parallel value tables,
18 entries each, $D419-$D460.

Two bytes are read from the datastream via $E98C and combined at $D47E-$D48F:

    p1 = byte1 & $0F        (also stored at $0488)
    p2 = byte2 & $07        (also stored at $041E)
    key = (p2 << 4) | p1

$D492 then searches fmtKeys backwards from index $11, and the matching index
selects one byte from each value table:

    fmtVals041C -> $041C      $00/$FF flag
    fmtVals041D -> $041D      $00/$FF flag
    fmtVals041F -> $041F      $01 or $02

The 18 keys are sorted and fall into three groups by p2 (1, 2 and 4), each
holding the same six p1 values (6, 7, A, B, C, F).

The search has no not-found path. If no key matches, DECB rolls 0 round to
$FF, BPL fails, and execution falls into the value lookups with B = $FF,
reading $D52A, $D53C and $D54E - 255 bytes past all three tables.

That case IS reachable: $D40A gates entry on the first byte being $20, but the
parameter bytes read afterwards at $D47E and $D483 are unconstrained, so p1
spans 16 values and p2 spans 8 and 110 of the 128 possible keys miss.

It is nevertheless harmless, because of what the three outputs feed:

  $041C  gets $7F, and $D551 tests only bit 7 (BMI) - reads as clear, i.e.
         the same as the intended $00
  $041D  gets $F6, and $D5AA/$D6BB test only bit 7 (BPL) - reads as set, i.e.
         the same as the intended $FF
  $041F  gets $DD instead of 1 or 2, but its only consumer at $D706 does
         ADDA $041F / CMPA #$7F / BCS / LDAA #$7F, so the result is clamped

The three over-read addresses are ordinary ROM locations, so the access is
well-defined on the bus. A missing bounds check with no crash or corruption
consequence - worth knowing about, not worth calling a bug."""
"0xD36A" = """
CEPT control-code interpreter.

Five jump tables, all reached through the same idiom:

    PSHA / ANDA #mask / ASLA / TAB / LDX #table / ABX / LDX 0,X / PULA / JMP 0,X

The guards above each site identify the range being decoded:

  $D374  A < $20            ctrlTableC0   32 entries  C0 control codes
  $D392  $80 <= A < $A0     ctrlTableC1a  32 entries  C1 controls, $0497 bit7 clear
  $D3A0  $80 <= A < $A0     ctrlTableC1b  32 entries  C1 controls, $0497 bit7 set
  $D3C3  after ESC ($1B)    escTable      96 entries  A - $20, range $20-$7F
  $D3E3  after CSI ($9B)    csiTable      96 entries  A - $20, range $20-$7F

$0497 selects between the two complete C1 sets. escSelectC1Set ($DFB5, reached
by ESC $22) is what writes it: it reads a parameter byte, masks bit 0 and
stores $FF or $00. ESC 2/2 is the CEPT serial/parallel attribute mode select,
so ctrlTableC1a is the serial set and ctrlTableC1b the parallel one.

The handler names follow the CEPT control sets and were checked against the
code, not just assumed: ctlAPB decrements cursorCol, ctlAPF increments it,
ctlCS resets scrollTop/scrollBottom, ctlRPT reads a count and re-emits the last
character, ctlSS2 sets the G-set selector to 2 while escLS2 sets both the
current and saved G-set - the single-shift versus locking-shift distinction.

All 106 distinct targets lie inside the ROM. Unhandled codes fall to
ctrlIgnored ($DA40, 14 of the 32 C0 slots) and seqIgnored ($FC42, 85 of the 96
slots in each of the ESC and CSI tables).

The escTable assignments are recognisably ISO 2022: $28-$2B designate G0-G3,
$6E/$6F are the locking shifts LS2/LS3, and $7C-$7E the single shifts."""
"0x8000" = """
Character generator: four 96-glyph sets of 20 bytes each, $8000-$9DFF.

Each glyph is 10 rows of 2 bytes. Rows are stored LITTLE-ENDIAN: the first byte
of a row is its RIGHT half, the second its LEFT half. Reading them in the
6801's usual big-endian order splits every glyph across two characters, which
is what makes this data look like garbage at first.

Ink occupies columns 4-15 of the swapped 16-bit word - the 12-pixel CEPT cell.
Bits 14-12 are always zero. Bit 15 is not ink: it is a per-glyph flag, uniform
across all ten rows of a glyph, and it marks CONTIGUOUS GRAPHICS - glyphs the
video hardware must draw edge to edge with no inter-character gap, as opposed
to normally spaced text.

Evidence is distributional rather than from code, because the firmware never
reads the character generator (its only references to the font area are two
LDD #$84D0 that are not even glyph-aligned), so the video hardware fetches it
directly and consumes this bit. Across the 349 live glyphs the flag agrees
with set membership 345 times, 98.9%:

  G0        95/96 clear
  accents   96/96 clear
  mosaic    94/96 set
  set3      60/61 set   (35 unused placeholder slots excluded)

All four exceptions are individually sensible, which is what makes the reading
convincing:

  G0 $7C      set. The full-height vertical bar - a line-drawing character
              that has to join the cells above and below, so it is contiguous
              even though it sits in the text set. Its neighbours { and } leave
              row 9 blank; $7C has ink in all ten rows.
  mosaic $4E  clear, and $5E likewise. These are the only two mosaic glyphs
  mosaic $5E  that leave rows 0 and 9 blank - separated rather than contiguous
              variants.
  set3 $20    clear. The space.

Not proven from firmware; a schematic or the display hardware would settle it.

  $8000  fontG0       96 glyphs  Latin alphanumerics and punctuation
  $8780  fontAccents  96 glyphs  non-spacing diacriticals and symbols (CEPT G2)
  $8F00  fontMosaic   96 glyphs  2x3 block mosaics (CEPT G1)
  $9680  fontSet3     96 glyphs  line-drawing/diagonals; $21-$3F are a repeated
                                 placeholder glyph rather than distinct shapes

Set 0 verified by rendering A-O and chr$21-$2F. Set 2 verified by the mosaic
bit progression: chr$21 lights the top-left block, $22 top-right, $23 both,
$24 middle-left - one bit per block, exactly as CEPT G1 specifies.

Render any of them with:  python3 tools/showfont.py <set> <first> <last>"""
"0x9E00" = """
Narrow character generator: 104 glyphs, 10 bytes each, $9E00-$A20F.

10 rows per glyph, 1 byte per row, 8 pixels wide. No byte-order surprise here.
Glyph 0 is chr$20 (space). The region ends at $A20F, immediately before the
first traced instruction at $A210.

Verified by rendering: A-H read correctly."""
"0xF129" = """
Interrupt soft-vector stubs.

Each stub loads a 16-bit handler address from internal RAM and jumps through
it, so handlers can be revectored at runtime. Reset installs nullHandler into
the vectors it does not use."""
"0xB200" = """
RESET entry.

Sets up the stack, configures ports 1 and 2, and installs the interrupt soft
vectors before entering the main firmware."""

