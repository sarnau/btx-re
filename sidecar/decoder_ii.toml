[block_comments]
"0xFCDB" = """
Screen line-address tables: four tables of 25 big-endian pointers, one entry
per display row, $FC45-$FD0C. 25 rows of 40 columns - the CEPT 24-row page
plus a status line.

  table  base    stride  span         role
  $FCDB  $4000     40    $4000-$43C7  rowRender   derived render byte per cell
  $FCA9  $4400    160    $4400-$539F  rowAttr     four attribute bytes per cell
  $FC77  $5400     40    $5400-$57C7  rowChar     character codes
  $FC45  $5800     40    $5800-$5BC7  rowAccent   combining diacritical overlay

$E9A5 reloads all four row pointers into rowChar/rowAttr/rowCharAlt/rowRender
whenever the cursor row changes. Roles established from the write sites:

  rowChar     $E943 on the main character path:
              LDAB cursorCol / LDX rowChar / ABX / LDAA charCode / ORAA #$80 /
              STAA 0,X - the character code with bit 7 set. Bit 7 is a per-cell
              flag rather than data: $A243, $DB1B, $DB96, $E538 and $EE21 all
              set it on this plane without touching the low seven bits, so it
              reads as a dirty/redraw marker.
  rowAttr     $E7E6 writes attr0..attr3 to 0,X..3,X at cursorCol*4. Those four
              bytes are only ever bit-manipulated by the C1 handlers at
              $DE00-$DF10 - the CEPT attribute set - and never receive a raw
              byte, which is what distinguishes them from the character code.
  rowRender   $E87E stores a byte assembled at $E860 from attribute bits
              (BITA #$03 -> ORAB #$02, BITA #$04 -> ORAB #$80, and so on), so
              this plane is derived state for the display hardware, not
              content.
  rowAccent   $E972, reached only when the character is a G2 non-spacing
              diacritical. Stores charCode AND $7F and sets accentPending.

The second character plane is NOT a duplicate: $5800 is the combining-accent
overlay. $E91D gates it on two conditions -

    LDAA gSetSelector / CMPA #$01      character came from G2
    LDAA charCode / ANDA #$70 / CMPA #$40   code in $40-$4F

which is exactly where CEPT G2 puts the non-spacing diacriticals, matching the
accent glyphs rendered from the $8780 font set. $E972 stores the mark and
returns WITHOUT advancing the cursor - the defining property of a combining
character - whereas the normal path at $E94E does INC cursorCol / JSR $EC16.

The sequence is:

  1. a G2 mark $40-$4F arrives: stored in the $5800 plane at the current cell,
     cursor unmoved, accentPending = $FF;
  2. the next character arrives: $E8D5 ORs bit 3 of accentPending into that
     cell's attribute byte, then clears accentPending;
  3. the base character goes to the $5400 plane and the cursor advances.

The firmware only ever writes $5800 - the sole reads of its row pointer are
the write at $E972 and the setup at $E9C1 - so the video hardware consumes it,
compositing the mark from $5800 over the glyph from $5400 with the attribute
bit as the enable."""
"0xF14C" = """
75-baud transmit: a software UART clocked by the timer output compare.

The BTX line is asymmetric - 1200 baud down, 75 baud up - and the two
directions are handled by completely different hardware:

  receive   the 6801 SCI, RMCR = $0C (CC1:CC0 = 11, EXTERNAL clock, so the
            modem supplies the 1200-baud bit clock). TRCSR = $08 enables the
            receiver only; $F5B4 later raises it to $18 for RE + RIE.
  transmit  this routine. TRCSR bit 1 (TE) is NEVER set and TDR is never
            written anywhere in the image, by any addressing mode - the SCI
            transmitter is entirely unused.

Each output compare reloads OCR with +$3415 (13333 cycles = 75.002 Hz at a
1 MHz E clock) and drives one bit by writing TCSR bit 0, which is OLVL - the
level the compare hardware places on P21. Letting the timer drive the pin
keeps the bit timing free of interrupt-latency jitter.

Frame: idle -> fetch a byte from the ring at txRing when head != tail, store
it complemented in txShift, set txBitsLeft = 9, and raise OLVL for the start
bit. Each later tick shifts the next bit into OLVL; when txBitsLeft reaches 1
the line is driven low for the stop bit.

With nothing to send the routine falls through to $F1B3, which services
housekeeping and a countdown at $04CB."""
"0xB2E2" = """
Ship the C64 payload across the dual-port interface.

    LDAA #$FF / STAA c64XferEn      enable transfer
    TST c64Status (twice)           wait for the C64, double-read for stability
  loop:
    LDX $0406 / INX
    CPX #$D109 / BEQ done           payload ends at $D108
    LDAA 0,X                        next payload byte
    LDAB c64FifoWr                  our write index
    LDX #c64Fifo / ABX              slot = $6080 + index
    INCB / ANDB #$0F                advance, 16-slot ring
    CMPB c64FifoRd (twice)          spin while full
    STAA 0,X / STAB c64FifoWr       store byte, publish index
    BRA loop
  done:
    CLR c64XferEn / wait c64Status / STAA c64XferDone

$0406 is the source pointer, seeded with LDX #$B3A5 at $B2DC; the INX before
each fetch makes $B3A6 the first byte sent - the two-byte load address the C64
loader consumes. So $B32D-$B3A5 is NOT streamed: the C64 executes it directly
from cartridge ROM at $8000. Only $B3A6-$D108 goes through the FIFO.

Both sides guard against metastability the same way, reading a shared index
twice and acting only when the two reads agree - CMPB c64FifoRd here, and
LDA $8009 / CMP $8009 / BNE in the C64 bootstrap.

$0406 is a shared scratch pointer, reused at $EA54 and elsewhere for pointer
tables at $FC45/$FC77/$FCA9/$FCDB."""
"0x1B1E" = """
Display cursor state.

$1B1F is the column, wrapped against 40 ($28) and 39 ($27) - the CEPT screen
width. $1B1E is the row, clamped between scrollTop ($1B1C) and scrollBottom
($1B1D) with an absolute ceiling in cursorRowMax ($1B00).

$EC16 is the wrap logic: column below 0 sets it to 39 and decrements the row;
column reaching 40 clears it and increments the row. $EC8D and $ECA1 are the
bounded row decrement and increment, each falling through to scroll ($EB28 /
$EA44) when the cursor is already at the window edge.

The $1B00-$1B2D block is therefore RAM holding display state, NOT a
memory-mapped peripheral as its all-read/write access pattern first suggested."""
"0x0000" = """
Hardware memory map, as established from the addresses the firmware touches.

  $0000-$001F  6801 internal register file
  $0080-$00FF  6801 internal RAM; interrupt soft vectors at $00F0-$00FB
  $0400-$07FF  external RAM, ~1 KB of variables; the stack grows down from
               $0400 (LDS #$0400 at reset), so $0000-$03FF is stack space
  $1B00-$1B2D  RAM holding display/cursor state (see $1B1E), not a peripheral
  $4000-$5BC7  display memory, four planes addressed via the line tables at
               $FCDB/$FCA9/$FC77/$FC45 (see the comment there)
  $6009-$6011  C64 dual-port control and status
  $6080-$608F  16-byte shared FIFO to the C64
  $61F9-$61FD  write-only control registers
  $8000-$FFFF  this ROM

Internal register usage shows PORT3 (43 accesses) as the busiest port, the
timer (TCSR/OCRH) in use, and the SCI active on RMCR, TRCSR and RDR. TDR is
never written by traced code, so the serial path looks receive-oriented in
what has been reached so far."""
"0xB32D" = """
C64-side 6502 code, $B32D-$D108. Not 6801 - the cartridge carries the C64's
BTX terminal application in the same 32 KB image as the 68B01 firmware, which
is why a 6801 trace never reaches it.

$B32D-$B3A5  c64Bootstrap  cartridge cold-start, runs at C64 $8000
$B3A6-$B3A7  c64LoadAddr   $00 $10 - little-endian load address $1000
$B3A8-$D108  c64Payload    7521 bytes, loaded to C64 $1000-$2D60

The bootstrap runs from cartridge ROM at C64 $8000 (ROM $B32D maps to $8000,
confirmed by the JMP $8036 at $B36D landing exactly on $B363):

    JSR $FDA3 / $FD90 / $FD15 / $FF5B   KERNAL init, restore vectors, CINT
    LDX #$00 / STX $D016                VIC setup
    JSR $804D / STA $61                 fetch load address low byte
    JSR $804D / STA $62                 fetch load address high byte
    LDY #$00
  loop:
    JSR $804D / BCS done / STA ($61),Y  copy one byte
    INY / BNE loop / INC $62 / JMP loop

$804D fetches the next byte from the decoder; carry set marks end of stream.
The two bytes at c64LoadAddr are the first thing that loop consumes, which is
what puts the payload at $1000. Ports $8000, $8001, $8009, $800A and $800B are
the C64's window onto the decoder hardware.

The payload begins with a 61-entry JMP table at runtime $1000-$10B6 - the
module's dispatch vector - with bodies at $174C-$2943.

Load address established three independent ways:
  1. the $00 $10 PRG header at $B3A6, consumed by the loader above;
  2. offset $A3A8 puts 97.6% of the payload's own JSR/JMP targets on real
     instruction boundaries, against 11.7% and 5.9% one byte either side;
  3. call sites JSR into a series spaced 3 apart based at $1009, which is
     entry 3 of the jump table at $1000.

German UI strings run $B552-$B9FF (runtime $11AA-$1657), padded to 40 columns:
"Load Capture Display Macro Xfer Screen", "ASCII Btx Keybd Telesoft Edit Pause
Quit", "Capture-Modus ein - Ende: STOP-Taste", and the macro prefix
"@:BTX-MAK-".

Note $D109-$D348 is NOT part of this payload - those are the 6801 control-code
dispatch tables documented at $D36A."""
"0xD419" = """
Format-parameter lookup: one key table plus three parallel value tables,
18 entries each, $D419-$D460.

Two bytes are read from the datastream via $E98C and combined at $D47E-$D48F:

    p1 = byte1 & $0F        (also stored at $0488)
    p2 = byte2 & $07        (also stored at $041E)
    key = (p2 << 4) | p1

$D492 then searches fmtKeys backwards from index $11, and the matching index
selects one byte from each value table:

    fmtVals041C -> $041C      $00/$FF flag
    fmtVals041D -> $041D      $00/$FF flag
    fmtVals041F -> $041F      $01 or $02

The 18 keys are sorted and fall into three groups by p2 (1, 2 and 4), each
holding the same six p1 values (6, 7, A, B, C, F).

The search has no not-found path. If no key matches, DECB rolls 0 round to
$FF, BPL fails, and execution falls into the value lookups with B = $FF,
reading $D52A, $D53C and $D54E - 255 bytes past all three tables.

That case IS reachable: $D40A gates entry on the first byte being $20, but the
parameter bytes read afterwards at $D47E and $D483 are unconstrained, so p1
spans 16 values and p2 spans 8 and 110 of the 128 possible keys miss.

It is nevertheless harmless, because of what the three outputs feed:

  $041C  gets $7F, and $D551 tests only bit 7 (BMI) - reads as clear, i.e.
         the same as the intended $00
  $041D  gets $F6, and $D5AA/$D6BB test only bit 7 (BPL) - reads as set, i.e.
         the same as the intended $FF
  $041F  gets $DD instead of 1 or 2, but its only consumer at $D706 does
         ADDA $041F / CMPA #$7F / BCS / LDAA #$7F, so the result is clamped

The three over-read addresses are ordinary ROM locations, so the access is
well-defined on the bus. A missing bounds check with no crash or corruption
consequence - worth knowing about, not worth calling a bug."""
"0xD36A" = """
CEPT control-code interpreter.

Five jump tables, all reached through the same idiom:

    PSHA / ANDA #mask / ASLA / TAB / LDX #table / ABX / LDX 0,X / PULA / JMP 0,X

The guards above each site identify the range being decoded:

  $D374  A < $20            ctrlTableC0   32 entries  C0 control codes
  $D392  $80 <= A < $A0     ctrlTableC1a  32 entries  C1 controls, $0497 bit7 clear
  $D3A0  $80 <= A < $A0     ctrlTableC1b  32 entries  C1 controls, $0497 bit7 set
  $D3C3  after ESC ($1B)    escTable      96 entries  A - $20, range $20-$7F
  $D3E3  after CSI ($9B)    csiTable      96 entries  A - $20, range $20-$7F

$0497 bit 7 selects between two complete C1 sets, which is how the serial and
parallel attribute modes of the CEPT presentation layer are switched.

All 106 distinct targets lie inside the ROM. Unhandled codes fall to
ctrlIgnored ($DA40, 14 of the 32 C0 slots) and seqIgnored ($FC42, 85 of the 96
slots in each of the ESC and CSI tables).

The escTable assignments are recognisably ISO 2022: $28-$2B designate G0-G3,
$6E/$6F are the locking shifts LS2/LS3, and $7C-$7E the single shifts."""
"0x8000" = """
Character generator: four 96-glyph sets of 20 bytes each, $8000-$9DFF.

Each glyph is 10 rows of 2 bytes. Rows are stored LITTLE-ENDIAN: the first byte
of a row is its RIGHT half, the second its LEFT half. Reading them in the
6801's usual big-endian order splits every glyph across two characters, which
is what makes this data look like garbage at first.

Ink occupies columns 4-15 of the swapped 16-bit word - the 12-pixel CEPT cell.
Bits 14-12 are always zero. Bit 15 is not ink: it is a per-glyph flag, uniform
across all ten rows of a glyph, and it marks CONTIGUOUS GRAPHICS - glyphs the
video hardware must draw edge to edge with no inter-character gap, as opposed
to normally spaced text.

Evidence is distributional rather than from code, because the firmware never
reads the character generator (its only references to the font area are two
LDD #$84D0 that are not even glyph-aligned), so the video hardware fetches it
directly and consumes this bit. Across the 349 live glyphs the flag agrees
with set membership 345 times, 98.9%:

  G0        95/96 clear
  accents   96/96 clear
  mosaic    94/96 set
  set3      60/61 set   (35 unused placeholder slots excluded)

All four exceptions are individually sensible, which is what makes the reading
convincing:

  G0 $7C      set. The full-height vertical bar - a line-drawing character
              that has to join the cells above and below, so it is contiguous
              even though it sits in the text set. Its neighbours { and } leave
              row 9 blank; $7C has ink in all ten rows.
  mosaic $4E  clear, and $5E likewise. These are the only two mosaic glyphs
  mosaic $5E  that leave rows 0 and 9 blank - separated rather than contiguous
              variants.
  set3 $20    clear. The space.

Not proven from firmware; a schematic or the display hardware would settle it.

  $8000  fontG0       96 glyphs  Latin alphanumerics and punctuation
  $8780  fontAccents  96 glyphs  non-spacing diacriticals and symbols (CEPT G2)
  $8F00  fontMosaic   96 glyphs  2x3 block mosaics (CEPT G1)
  $9680  fontSet3     96 glyphs  line-drawing/diagonals; $21-$3F are a repeated
                                 placeholder glyph rather than distinct shapes

Set 0 verified by rendering A-O and chr$21-$2F. Set 2 verified by the mosaic
bit progression: chr$21 lights the top-left block, $22 top-right, $23 both,
$24 middle-left - one bit per block, exactly as CEPT G1 specifies.

Render any of them with:  python3 tools/showfont.py <set> <first> <last>"""
"0x9E00" = """
Narrow character generator: 104 glyphs, 10 bytes each, $9E00-$A20F.

10 rows per glyph, 1 byte per row, 8 pixels wide. No byte-order surprise here.
Glyph 0 is chr$20 (space). The region ends at $A20F, immediately before the
first traced instruction at $A210.

Verified by rendering: A-H read correctly."""
"0xF129" = """
Interrupt soft-vector stubs.

Each stub loads a 16-bit handler address from internal RAM and jumps through
it, so handlers can be revectored at runtime. Reset installs nullHandler into
the vectors it does not use."""
"0xB200" = """
RESET entry.

Sets up the stack, configures ports 1 and 2, and installs the interrupt soft
vectors before entering the main firmware."""

