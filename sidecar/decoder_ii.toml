# The two 6502 blocks. Each is assembled as its own program at the address it
# really runs at, and linked back in as binary.
#
# The payload starts two bytes early, at the PRG load-address word, and is
# ORGed to $0FFE so the data still lands at $1000. That makes c64_payload.bin a
# genuine C64 .prg - load address followed by data - which is exactly what the
# 6801 streams and what the bootstrap's loader consumes.
[[c64_blocks]]
name = "bootstrap"
start = 0xB32D
end = 0xB3A6
org = 0x8000

[[c64_blocks]]
name = "payload"
start = 0xB3A6
end = 0xD109
org = 0x0FFE

# The C64's view of the decoder hardware. The 6801 sees the same registers at
# $6000; see the block comment at $B2E2 for the pairing. $8000/$8001 are RAM
